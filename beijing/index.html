<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Beijing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@500;700&display=swap">
<style>
/* Layout: one full-bleed canvas (the map) with two small paper cards floating over it: title top-left, transport bottom. */
:root{
  --paper:#f7f0e1;       /* cream sheet */
  --ink:#5c4842;         /* soft brown line work */
  --ink-soft:#8c776e;
  --bridge:#d9553f;      /* pearl-tower pink */
  --card:rgba(251,246,234,.86);
  --rule:rgba(92,72,66,.22);
  --hand:'Caveat','Segoe Print','Comic Sans MS',cursive;
  --ui:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --btn:#fffaf0;
  color-scheme:light;
}
body.night{--paper:#2b2e52;--ink:#f1e8d4;--ink-soft:#b8afc8;--card:rgba(34,38,70,.86);--rule:rgba(240,230,210,.2);--btn:#323764;--bridge:#ff8a6a;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);overflow:hidden}
body{font-family:var(--ui)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.card{position:fixed;background:var(--card);border:1px solid var(--rule);border-radius:14px;
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 6px 18px -10px rgba(92,72,66,.35);backdrop-filter:blur(2px)}
.title{top:calc(env(safe-area-inset-top,0px) + 16px);left:calc(env(safe-area-inset-left,0px) + 16px);
  padding:12px 18px 12px;max-width:min(360px,calc(100vw - 64px))}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
h1{font-family:var(--hand);font-weight:700;font-size:40px;line-height:1;margin:2px 0 4px;text-wrap:balance}
h1 span{color:var(--bridge)}
.chapter{font-family:var(--hand);font-size:21px;line-height:1.15;min-height:1.15em;transition:opacity .5s}
.controls{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  display:flex;align-items:center;gap:12px;padding:8px 14px 8px 8px;width:min(460px,calc(100vw - 32px));box-sizing:border-box}
button{appearance:none;border:1px solid var(--rule);background:var(--btn);color:var(--ink);width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;flex:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--bridge);outline-offset:2px}
button svg{width:14px;height:14px;fill:currentColor}
input[type=range]{flex:1;min-width:0;accent-color:var(--bridge);height:24px}
.time{font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-soft);font-weight:700;flex:none}
@media (max-width:560px){h1{font-size:32px}.chapter{font-size:18px}.title{padding:10px 14px}}
.home{color:inherit;text-decoration:none}.home:hover{color:var(--bridge)}
body.bare .card{display:none}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="Animated hand-drawn isometric map of Beijing that builds itself over 50 seconds"></canvas>

<header class="card title">
  <div class="eyebrow"><a class="home" href="../">← All cities</a> · Illustrated city · 39.90° N 116.40° E</div>
  <h1>Little <span>Beijing</span></h1>
  <div class="chapter" id="chapter">Morning in Beijing. The streets come first.</div>
</header>

<div class="card controls">
  <button id="play" aria-label="Pause"><svg viewBox="0 0 14 14" id="icon"><rect x="2" y="1" width="3.5" height="12" rx="1"/><rect x="8.5" y="1" width="3.5" height="12" rx="1"/></svg></button>
  <input type="range" id="scrub" min="0" max="50" step="0.01" value="0" aria-label="Timeline">
  <span class="time" id="time">0:00 / 0:50</span>
  <button id="mode" aria-label="Switch to night"><svg viewBox="0 0 14 14" id="modeIcon"></svg></button>
</div>

<script>
(()=>{
'use strict';
/* =========================================================
   Little Beijing — a 50 s self-building isometric city
   Pure Canvas 2D. Everything is drawn from code.
   ========================================================= */
const cvs=document.getElementById('c'), ctx=cvs.getContext('2d');
/* Night mode: every colour the scene sets is pushed through a moonlight filter,
   except while LIT is on (light sources). Glows are collected and added afterwards. */
let NIGHT=false,LIT=0;const LIGHTS=[];
const NIGHT_OVR={'#f7f0e1':'#34375f','#bfe2e1':'#24345e','#94c7ca':'#1b284f','#80b6bc':'#162146','#f4fbf6':'rgba(150,175,225,.55)'};
const _nc=new Map();
function nightCol(c){if(typeof c!=='string')return c;let v=_nc.get(c);if(v!==undefined)return v;
  if(NIGHT_OVR[c]){_nc.set(c,NIGHT_OVR[c]);return NIGHT_OVR[c]}
  let r,g,b,a=1;if(c[0]==='#'){const n=parseInt(c.slice(1),16);r=n>>16&255;g=n>>8&255;b=n&255}
  else{const m=c.match(/[\d.]+/g);if(!m||m.length<3)return c;r=+m[0];g=+m[1];b=+m[2];if(m[3]!==undefined)a=+m[3]}
  v=`rgba(${(r*.32+8)|0},${(g*.35+12)|0},${(b*.48+40)|0},${a})`;if(_nc.size>6000)_nc.clear();_nc.set(c,v);return v}
for(const prop of['fillStyle','strokeStyle']){const d=Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype,prop);
  Object.defineProperty(ctx,prop,{get(){return d.get.call(this)},set(v){d.set.call(this,NIGHT&&!LIT?nightCol(v):v)}})}
const _acs=CanvasGradient.prototype.addColorStop;CanvasGradient.prototype.addColorStop=function(o,c){_acs.call(this,o,NIGHT&&!LIT?nightCol(c):c)};
function light(x,y,s,kind,a=1,flat=0){if(!NIGHT)return;const m=ctx.getTransform();LIGHTS.push([m.a*x+m.c*y+m.e,m.b*x+m.d*y+m.f,s*m.a,kind,a*ctx.globalAlpha,flat])}
function lit(fn){const o=LIT;LIT=1;fn();LIT=o}
function litDot(p,r,col){lit(()=>{ctx.fillStyle=col;ctx.beginPath();ctx.arc(p[0],p[1],r,0,Math.PI*2);ctx.fill()})}
// glow sprites: 0 warm, 1 white, 2 red, 3 cyan, 4 lantern, 5 rose
const GLOW=[[255,196,110],[225,236,255],[255,70,55],[150,225,255],[255,120,70],[240,140,215]].map(([r,g,b])=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
  const gr=x.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,`rgba(${r},${g},${b},1)`);gr.addColorStop(.22,`rgba(${r},${g},${b},.42)`);gr.addColorStop(1,`rgba(${r},${g},${b},0)`);x.fillStyle=gr;x.fillRect(0,0,128,128);return c});
const hsh=(a,b,c)=>{const h=Math.sin(a*91.7+b*47.3+c*13.1)*43758.5;return h-Math.floor(h)};
const LOOP=50;
let W=0,H=0,DPR=1,baseZoom=1,overlay=null;

/* ---------- math + projection ---------- */
const P=(x,y,z=0)=>[(x-y)*32,(x+y)*16-z];          // tile coords -> world px (2:1 iso)
const clamp01=v=>v<0?0:v>1?1:v;
const lerp=(a,b,u)=>a+(b-a)*u;
const easeOut=u=>1-Math.pow(1-u,3);
const easeInOut=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
const easeBack=u=>{const c1=1.6,c3=c1+1;return 1+c3*Math.pow(u-1,3)+c1*Math.pow(u-1,2)};
const smooth=u=>u*u*(3-2*u);
const TAU=Math.PI*2, RX=45.255, RY=22.627;           // iso circle radii per tile
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(1420);
const pick=a=>a[(R()*a.length)|0];
const rr=(a,b)=>a+R()*(b-a);

/* ---------- palette ---------- */
const INK='rgba(92,72,66,.9)', INK2='rgba(92,72,66,.42)';
const COL={paper:'#f7f0e1',water:'#bfe2e1',waterSide:'#94c7ca',waterSide2:'#80b6bc',foam:'#f4fbf6',
  road:'#e9e2d4',roadSide:'#d9c8a6',roadSide2:'#c9b48e',line:'#fffbf2',walk:'#ece4d4',
  lot:'#f5ebd6',lotSide:'#e3d2af',lotSide2:'#d2bd97',grass:'#c6e4a8',forest:'#b4d898',plaza:'#f0e5cf',
  path:'#f1e5c8',sand:'#f3dfb1',red:'#e8664d',redD:'#c5513c',rail:'#b5a691'};
const WALLS=['#fff5e4','#fde2d4','#e3f0dc','#e2eaf7','#fbedc4','#f2e0ef','#fdf0da','#dcefec','#fbe0e6'];
const ROOFS=['#f2a69b','#f5c38c','#9dd2bf','#b5a6de','#eed487','#9bc2e5','#f3b1c6','#cdb89a','#a9d79c'];
const OFFICE=['#eef2f5','#f3ead9','#e3ebf2','#efe0d0','#dde9e3','#f5efe6','#e8e4f1'];
const TREES=['#9fd08a','#8bc57a','#b3db8e','#7db979','#a7d6a0'];
const SKIN=['#f3cfae','#e3b088','#c98d5e','#9a6542','#6b4430','#f7dcc6','#d9a27a'];
const SHIRT=['#e86f68','#5d9bd5','#f2c14e','#7bc47f','#b28dd6','#f49ac1','#4fb3b0','#ff9f5a','#fdfbf5','#5a6f93','#e85d8a','#7f6bbf','#f6d365'];
const PANTS=['#5a6f93','#3f4a5c','#8a6f5a','#c9b79c','#6d8a6a','#4b5d73','#b56f5b'];
const HAIR=['#3a2a22','#5b3b26','#1f1a1a','#a0662f','#d9b26a','#7a7a7a','#2c2320'];
const CARS=['#f28b82','#8ab4f8','#fdd663','#81c995','#c58af9','#fcad70','#f6f1e7','#78d9d0','#f7a8c8','#a3b8c9'];

const _sc=new Map();
function shade(hex,k){if(hex[0]!=='#')return hex;const key=hex+k;let v=_sc.get(key);if(v)return v;const n=parseInt(hex.slice(1),16);let r=n>>16&255,g=n>>8&255,b=n&255;
  if(k<=1){r*=k;g*=k;b*=k}else{const f=k-1;r+=(255-r)*f;g+=(255-g)*f;b+=(255-b)*f}v=`rgb(${r|0},${g|0},${b|0})`;_sc.set(key,v);return v}

/* ---------- hand-drawn primitives ---------- */
let JIT=1; // static shapes get a stable wobble; moving things stay clean
function jx(x,y){const h=Math.sin(x*12.9898+y*78.233)*43758.5453;return(h-Math.floor(h)-.5)*.9}
function jy(x,y){const h=Math.sin(x*39.3467+y*11.135)*24634.6345;return(h-Math.floor(h)-.5)*.9}
function path(pts){ctx.beginPath();for(let i=0;i<pts.length;i++){const p=pts[i];let x=p[0],y=p[1];if(JIT){x+=jx(p[0],p[1]);y+=jy(p[0],p[1])}i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath()}
function poly(pts,fill,lw=1,stroke=INK){path(pts);if(fill){ctx.fillStyle=fill;ctx.fill()}if(lw){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function q(a,b,c,d){ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.lineTo(d[0],d[1]);ctx.closePath()}
function line(a,b,col=INK,lw=1){ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.stroke()}
function box(x,y,z,w,d,h,col,lw=1,top,right,left){
  const a=P(x,y+d,z),b=P(x+w,y+d,z),c=P(x+w,y,z),at=P(x,y+d,z+h),bt=P(x+w,y+d,z+h),ct=P(x+w,y,z+h),dt=P(x,y,z+h);
  poly([a,b,bt,at],left||shade(col,.93),lw);
  poly([b,c,ct,bt],right||shade(col,.82),lw);
  poly([dt,ct,bt,at],top||col,lw);
}
function obox(cx,cy,z,hx,hy,L,Wd,h,col,lw=.8){ // oriented box for vehicles/boats
  const px=-hy,py=hx,l=L/2,w=Wd/2;
  const C=[[cx+hx*l+px*w,cy+hy*l+py*w],[cx+hx*l-px*w,cy+hy*l-py*w],[cx-hx*l-px*w,cy-hy*l-py*w],[cx-hx*l+px*w,cy-hy*l+py*w]];
  for(let i=0;i<4;i++){const A=C[i],B=C[(i+1)&3];const mx=(A[0]+B[0])/2-cx,my=(A[1]+B[1])/2-cy;
    if(mx+my>1e-6)poly([P(A[0],A[1],z),P(B[0],B[1],z),P(B[0],B[1],z+h),P(A[0],A[1],z+h)],shade(col,mx>my?.82:.93),lw)}
  poly(C.map(c=>P(c[0],c[1],z+h)),col,lw);
}
function cyl(cx,cy,z,r,h,col,lw=1){
  const b=P(cx,cy,z),tp=P(cx,cy,z+h),rx=r*RX,ry=r*RY;
  const g=ctx.createLinearGradient(b[0]-rx,0,b[0]+rx,0);g.addColorStop(0,shade(col,1.1));g.addColorStop(.5,col);g.addColorStop(1,shade(col,.8));
  ctx.beginPath();ctx.moveTo(b[0]-rx,tp[1]);ctx.lineTo(b[0]-rx,b[1]);ctx.ellipse(b[0],b[1],rx,ry,0,Math.PI,0,true);ctx.lineTo(b[0]+rx,tp[1]);ctx.closePath();
  ctx.fillStyle=g;ctx.fill();if(lw){ctx.strokeStyle=INK;ctx.lineWidth=lw;ctx.stroke()}
  ctx.beginPath();ctx.ellipse(tp[0],tp[1],rx,ry,0,0,TAU);ctx.fillStyle=shade(col,1.12);ctx.fill();if(lw)ctx.stroke();
}
function dome(cx,cy,z,r,h,col,rib){
  const b=P(cx,cy,z),rx=r*RX,ry=r*RY;
  const g=ctx.createLinearGradient(b[0]-rx,b[1]-h,b[0]+rx,b[1]);g.addColorStop(0,shade(col,1.15));g.addColorStop(1,shade(col,.82));
  ctx.beginPath();ctx.moveTo(b[0]-rx,b[1]);ctx.ellipse(b[0],b[1],rx,h,0,Math.PI,TAU);ctx.ellipse(b[0],b[1],rx,ry,0,0,Math.PI);ctx.closePath();
  ctx.fillStyle=g;ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=1;ctx.stroke();
  if(rib){ctx.strokeStyle=rib;ctx.lineWidth=1.3;ctx.beginPath();
    for(let k=-3;k<=3;k++){const c=Math.sin(k*.42);for(let i=0;i<=12;i++){const th=i/12*Math.PI/2;const x=b[0]+rx*c*Math.cos(th),y=b[1]+ry*Math.cos(k*.42)*Math.cos(th)*.9-h*Math.sin(th);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}}
    ctx.stroke()}
}
function pyramid(cx,cy,z,hw,Hh,col){
  const A=P(cx,cy,z+Hh),c1=P(cx+hw,cy-hw,z),c2=P(cx+hw,cy+hw,z),c3=P(cx-hw,cy+hw,z);
  poly([c1,c2,A],shade(col,.84));poly([c3,c2,A],shade(col,.97));
  ctx.beginPath();for(let i=1;i<14;i++){const u=i/14;const a=[lerp(c1[0],A[0],u),lerp(c1[1],A[1],u)],b=[lerp(c2[0],A[0],u),lerp(c2[1],A[1],u)],c=[lerp(c3[0],A[0],u),lerp(c3[1],A[1],u)];ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c[0],c[1])}
  ctx.strokeStyle=INK2;ctx.lineWidth=.6;ctx.stroke();
}
function hipRoof(x,y,z,w,d,rh,ov,col,inset=.3,curl=true){ // pagoda-style tier with upturned eaves
  const x0=x-ov,y0=y-ov,x1=x+w+ov,y1=y+d+ov,ix0=x+w*inset,ix1=x+w*(1-inset),iy0=y+d*inset,iy1=y+d*(1-inset),zt=z+rh;
  const B=[P(x0,y0,z),P(x1,y0,z),P(x1,y1,z),P(x0,y1,z)],U=[P(ix0,iy0,zt),P(ix1,iy0,zt),P(ix1,iy1,zt),P(ix0,iy1,zt)];
  poly([B[0],B[1],U[1],U[0]],shade(col,.78));poly([B[3],B[0],U[0],U[3]],shade(col,.84));
  poly([B[1],B[2],U[2],U[1]],shade(col,.86));poly([B[2],B[3],U[3],U[2]],col);poly(U,shade(col,1.1));
  ctx.beginPath();for(let i=1;i<6;i++){const u=i/6;const a=[lerp(B[3][0],B[2][0],u),lerp(B[3][1],B[2][1],u)],b=[lerp(U[3][0],U[2][0],u),lerp(U[3][1],U[2][1],u)];ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1])}
  ctx.strokeStyle=INK2;ctx.lineWidth=.6;ctx.stroke();
  if(curl){ctx.beginPath();ctx.moveTo(B[1][0],B[1][1]);ctx.quadraticCurveTo(B[1][0]+2,B[1][1],B[1][0]+3,B[1][1]-3);ctx.moveTo(B[3][0],B[3][1]);ctx.quadraticCurveTo(B[3][0]-2,B[3][1],B[3][0]-3,B[3][1]-3);ctx.moveTo(B[2][0],B[2][1]);ctx.lineTo(B[2][0],B[2][1]-3);ctx.strokeStyle=INK;ctx.lineWidth=1.2;ctx.stroke()}
}
function flag(bx,by,ph,w,h,col,T,seed=0){
  line([bx,by],[bx,by-ph],INK,.9);const top=by-ph;ctx.beginPath();const n=6;
  for(let i=0;i<=n;i++){const u=i/n;const yy=top+Math.sin(T*5+u*4+seed)*1.5*u;i?ctx.lineTo(bx+u*w,yy):ctx.moveTo(bx,yy)}
  for(let i=n;i>=0;i--){const u=i/n;ctx.lineTo(bx+u*w,top+h+Math.sin(T*5+u*4+seed-.4)*1.5*u)}
  ctx.closePath();ctx.fillStyle=col;ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=.7;ctx.stroke();
}
function withPop(ax,ay,az,t0,t,fn){
  const p=(t-t0)/.7;if(p<=0)return;if(p>=1){fn();return}
  const e=easeBack(p),b=P(ax,ay,az);ctx.save();ctx.globalAlpha*=clamp01(p*3);ctx.translate(b[0],b[1]);ctx.scale(.65+.35*Math.min(e,1.1),Math.max(.001,e));ctx.translate(-b[0],-b[1]);fn();ctx.restore();
}

/* ---------- little things ---------- */
function mkLook(kid){return{skin:pick(SKIN),shirt:pick(SHIRT),pants:pick(PANTS),hair:pick(HAIR),s:kid?rr(.62,.72):rr(.88,1.08),ph:R()*TAU,sp:rr(.8,1.2)}}
function drawPerson(x,y,z,L,T,mode,face=0){ // mode 0 walk, 1 stand, 2 sit
  const b=P(x,y,z),s=.6*L.s,X=b[0],Y=b[1];const ph=T*7.5*L.sp+L.ph,bob=mode===0?Math.abs(Math.sin(ph))*.8*s:0;
  ctx.fillStyle='rgba(90,70,50,.18)';ctx.beginPath();ctx.ellipse(X,Y,2.6*s,1.2*s,0,0,TAU);ctx.fill();
  let by;
  if(mode===2){by=Y-1.2*s;ctx.strokeStyle=L.pants;ctx.lineWidth=1.6*s;ctx.beginPath();ctx.moveTo(X-.6*s,by);ctx.lineTo(X+2.4*s,by+.9*s);ctx.stroke()}
  else{const sw=mode===0?Math.sin(ph)*1.4*s:0;by=Y-3.8*s-bob;ctx.strokeStyle=L.pants;ctx.lineWidth=1.4*s;ctx.beginPath();ctx.moveTo(X-.7*s,by);ctx.lineTo(X-.7*s+sw,Y-.2);ctx.moveTo(X+.7*s,by);ctx.lineTo(X+.7*s-sw,Y-.2);ctx.stroke()}
  const bh=4.6*s;ctx.fillStyle=L.shirt;ctx.beginPath();ctx.roundRect(X-1.6*s,by-bh,3.2*s,bh+.4*s,1.3*s);ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=.55;ctx.stroke();
  if(face){ctx.beginPath();ctx.moveTo(X+1.4*s,by-bh+1);ctx.lineTo(X+3.2*s,by-bh-2.5*s);ctx.strokeStyle=L.skin;ctx.lineWidth=1.1*s;ctx.stroke()}
  const hy=by-bh-1.7*s;ctx.fillStyle=L.skin;ctx.beginPath();ctx.arc(X,hy,1.75*s,0,TAU);ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=.55;ctx.stroke();
  ctx.fillStyle=L.hair;ctx.beginPath();ctx.arc(X,hy-.2*s,1.85*s,Math.PI*1.05,Math.PI*1.95);ctx.fill();
  return[X+3.2*s,by-bh-2.5*s];
}
function drawDog(x,y,z,T,col='#c08a5b',big=1){
  const b=P(x,y,z),X=b[0],Y=b[1],s=.6*big,ph=T*10;
  ctx.fillStyle='rgba(90,70,50,.16)';ctx.beginPath();ctx.ellipse(X,Y,3.4*s,1.3*s,0,0,TAU);ctx.fill();
  ctx.strokeStyle=INK;ctx.lineWidth=.9*s;ctx.beginPath();for(let i=0;i<4;i++){const lx=X-2.2*s+i*1.45*s;ctx.moveTo(lx,Y-2*s);ctx.lineTo(lx+Math.sin(ph+i*1.6)*.8*s,Y)}ctx.stroke();
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(X,Y-2.8*s,3.2*s,1.7*s,0,0,TAU);ctx.fill();ctx.lineWidth=.55;ctx.stroke();

    ctx.beginPath();ctx.moveTo(0,6);for(let i=1;i<=8;i++)ctx.lineTo(Math.sin(k.T*4+i+k.ph)*2.2,6+i*2.4);ctx.strokeStyle=INK;ctx.lineWidth=.6;ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,-6);ctx.lineTo(4.5,0);ctx.lineTo(0,6);ctx.closePath();ctx.fillStyle=k.c[0];ctx.fill();ctx.beginPath();ctx.moveTo(0,-6);ctx.lineTo(-4.5,0);ctx.lineTo(0,6);ctx.closePath();ctx.fillStyle=k.c[1];ctx.fill();
    ctx.beginPath();ctx.moveTo(0,-6);ctx.lineTo(4.5,0);ctx.lineTo(0,6);ctx.lineTo(-4.5,0);ctx.closePath();ctx.moveTo(-4.5,0);ctx.lineTo(4.5,0);ctx.strokeStyle=INK;ctx.lineWidth=.7;ctx.stroke();ctx.restore()}
  ctx.beginPath();for(const g of SWIFTS){const a=T*g.sp+g.ph,p=P(g.cx+Math.cos(a)*g.r,g.cy+Math.sin(a)*g.r,g.z+Math.sin(T+g.ph)*6),f=Math.sin(T*9+g.ph)*2;ctx.moveTo(p[0]-4,p[1]+f*.3);ctx.quadraticCurveTo(p[0]-2,p[1]-f,p[0],p[1]);ctx.quadraticCurveTo(p[0]+2,p[1]-f,p[0]+4,p[1]+f*.3)}
  if(t>27){for(const b of FLOCK){const a=T*.5+b.o,p=P(27+Math.cos(a)*b.r*1.4,20.5+Math.sin(a)*b.r*2,70+b.dz+Math.sin(T*1.3+b.ph)*4),f=Math.sin(T*10+b.ph)*1.8;ctx.moveTo(p[0]-3,p[1]+f*.3);ctx.quadraticCurveTo(p[0]-1.5,p[1]-f,p[0],p[1]);ctx.quadraticCurveTo(p[0]+1.5,p[1]-f,p[0]+3,p[1]+f*.3)}}
  ctx.strokeStyle=INK;ctx.lineWidth=.9;ctx.stroke();
  for(const c of CLOUDS){const p=P(c.x+Math.sin(T*.05+c.ph)*2,c.y,c.z);ctx.beginPath();for(const[dx,dy,r]of c.puffs){ctx.moveTo(p[0]+dx+r,p[1]+dy);ctx.arc(p[0]+dx,p[1]+dy,r,0,TAU)}
    ctx.strokeStyle='rgba(92,72,66,.35)';ctx.lineWidth=2.4;ctx.stroke();ctx.fillStyle='rgba(255,253,247,.92)';ctx.fill()}
  const fs=13/Math.sqrt(zt),la=clamp01((zt-.45)/.3);if(la<=0)return;
  ctx.font=`700 ${fs}px Caveat, 'Segoe Print', cursive`;ctx.textAlign='center';ctx.textBaseline='bottom';
  for(const[txt,x,y,z,t0]of LABELS){const a=clamp01((t-t0)/1)*la;if(a<=0)continue;const p=P(x,y,z);ctx.globalAlpha=a;
    LIT=1;ctx.strokeStyle=NIGHT?'rgba(30,33,64,.9)':'rgba(247,240,225,.95)';ctx.lineWidth=fs*.32;ctx.lineJoin='round';ctx.strokeText(txt,p[0],p[1]-6);ctx.fillStyle=NIGHT?'#f6ead0':'#5c4842';ctx.fillText(txt,p[0],p[1]-6);LIT=0;
    ctx.beginPath();ctx.moveTo(p[0],p[1]-4);ctx.lineTo(p[0],p[1]+2);ctx.strokeStyle=INK2;ctx.lineWidth=.8;ctx.stroke()}
  ctx.globalAlpha=1;
}

/* ---------- camera ---------- */
const HOME=[18.5,19.8,40,1.0];
const KEYS=[[0,...HOME],[3.6,15,19.5,40,1.05],[7.0,1.8,16.5,55,1.7],[9.6,1.6,24,55,1.7],[12.0,6.8,19.8,30,1.95],[15.6,11.8,20.5,30,1.95],[19.6,13.0,28.6,20,1.6],
  [23.4,24.4,28.6,16,2.3],[27.2,21.2,20.5,30,1.6],[29.8,20.6,20.4,30,1.9],[32.8,29.4,21.0,30,1.7],[36.2,38.4,20.4,22,2.1],[39.6,36.4,8.8,26,1.8],[43.4,21.4,8.4,110,1.45],[47,...HOME],[50,...HOME]];
function camAt(t){let i=0;while(i<KEYS.length-2&&t>=KEYS[i+1][0])i++;const k0=KEYS[Math.max(0,i-1)],k1=KEYS[i],k2=KEYS[i+1],k3=KEYS[Math.min(KEYS.length-1,i+2)];
  const u=clamp01((t-k1[0])/(k2[0]-k1[0])),cr=j=>{const a=k0[j],b=k1[j],c=k2[j],d=k3[j];return .5*(2*b+(-a+c)*u+(2*a-5*b+4*c-d)*u*u+(-a+3*b-3*c+d)*u*u*u)};
  return{x:cr(1)+Math.sin(t*.4)*.15,y:cr(2)+Math.cos(t*.33)*.15,z:cr(3),zoom:Math.max(.85,cr(4))*(1+Math.sin(t*.5)*.012)}}
const CHAPTERS=[[0,'Morning in Beijing. The streets come first.'],[5,'The Great Wall winds over the hills'],[10,"The Bird's Nest and the Water Cube"],[13.6,'Drum and Bell Towers, and Jingshan hill'],
  [17.6,'Boats on Beihai and Houhai'],[21.6,'Hutong life'],[25.6,"The Forbidden City's golden roofs"],[30.6,'Tiananmen and the Square'],[34.6,'Qianmen and the little tram'],
  [37.6,'Tai chi at the Temple of Heaven'],[41.6,'The CBD and the CCTV tower'],[46,'The whole city, wide awake']];
const CHAPTERS_NIGHT=['Evening in Beijing. The lamps come on first.','Lamps along the Great Wall',"The Bird's Nest glows red",'Lanterns at the Drum Tower','Lantern-lit bars on Houhai',
  'Lights in the hutong courtyards','Golden edges on the palace roofs','Tiananmen glowing gold','Qianmen lit up','The Temple of Heaven, floodlit','The CBD sparkles','The whole city, lit up'];

const STARS=Array.from({length:70},()=>[R(),R(),rr(1,3),R()*TAU,rr(.6,1.4)]);
function drawGlows(){ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='lighter';const w=cvs.width,h=cvs.height;
  for(const[x,y,s,k,a,f]of LIGHTS){if(a<=.01||x<-s||y<-s||x>w+s||y>h+s)continue;ctx.globalAlpha=Math.min(1,a);if(f)ctx.drawImage(GLOW[k],x-s,y-s*.5,2*s,s);else ctx.drawImage(GLOW[k],x-s,y-s,2*s,2*s)}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}
function drawMoon(T,ma){if(ma<=.01)return;ctx.globalAlpha=ma;const ph=W<560,x=W-(ph?62:120),y=ph?200:118,r=ph?18:26;LIT=1;
  for(const s of STARS){const sx=s[0]*W,sy=s[1]*H*.42;if(sx<380&&sy<150)continue;const a=.25+.3*(1+Math.sin(T*s[2]+s[3]))/2,l=s[4]*2.2;ctx.strokeStyle=`rgba(255,246,220,${a})`;ctx.lineWidth=.9;ctx.beginPath();ctx.moveTo(sx-l,sy);ctx.lineTo(sx+l,sy);ctx.moveTo(sx,sy-l);ctx.lineTo(sx,sy+l);ctx.stroke()}
  ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.4*ma;ctx.drawImage(GLOW[1],x-r*5,y-r*5,r*10,r*10);ctx.globalAlpha=ma;ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#fbf3d9';ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.strokeStyle='rgba(120,100,80,.55)';ctx.lineWidth=1.2;ctx.stroke();
  ctx.fillStyle='rgba(214,198,160,.65)';for(const[dx,dy,cr]of[[-.35,-.2,.22],[.25,.3,.16],[.1,-.45,.1],[-.1,.45,.09]]){ctx.beginPath();ctx.arc(x+dx*r,y+dy*r,cr*r,0,TAU);ctx.fill()}ctx.globalAlpha=1;LIT=0}

/* ---------- paper ---------- */
function buildOverlay(){LIT=1;try{return buildOverlay0()}finally{LIT=0}}
function buildOverlay0(){
  const o=document.createElement('canvas');o.width=Math.ceil(W*DPR);o.height=Math.ceil(H*DPR);const c=o.getContext('2d');
  const tile=document.createElement('canvas');tile.width=tile.height=256;const tc=tile.getContext('2d'),img=tc.createImageData(256,256),r2=rng(9);
  for(let i=0;i<img.data.length;i+=4){let v=255-r2()*14;if(r2()<.006)v-=40;img.data[i]=v;img.data[i+1]=v-2;img.data[i+2]=v-8;img.data[i+3]=255}tc.putImageData(img,0,0);
  c.fillStyle=c.createPattern(tile,'repeat');c.fillRect(0,0,o.width,o.height);
  c.strokeStyle='rgba(150,120,90,.10)';c.lineWidth=DPR;for(let i=0;i<W*H/2500;i++){const x=r2()*o.width,y=r2()*o.height,a=r2()*TAU,l=(6+r2()*18)*DPR;c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+Math.cos(a+.6)*l*.5,y+Math.sin(a+.6)*l*.5,x+Math.cos(a)*l,y+Math.sin(a)*l);c.stroke()}
  const g=c.createRadialGradient(o.width/2,o.height/2,Math.min(o.width,o.height)*.35,o.width/2,o.height/2,Math.hypot(o.width,o.height)*.6);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(190,160,120,.35)');c.fillStyle=g;c.fillRect(0,0,o.width,o.height);
  return o;
}
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cvs.width=Math.round(W*DPR);cvs.height=Math.round(H*DPR);
  const fit=Math.min(W/2650,H/1560);baseZoom=W<H?Math.max(fit,W/1820):fit;overlay=buildOverlay()}
addEventListener('resize',resize);resize();

/* ---------- render ---------- */
function render(t,T){
  SKY.length=0;LIGHTS.length=0;
  const cam=camAt(t),zt=cam.zoom*baseZoom,[csx,csy]=P(cam.x,cam.y,cam.z);
  const vx0=csx-W/2/zt,vx1=csx+W/2/zt,vy0=csy-H/2/zt,vy1=csy+H/2/zt;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.fillStyle=COL.paper;ctx.fillRect(0,0,W,H);
  ctx.setTransform(DPR*zt,0,0,DPR*zt,DPR*(W/2-csx*zt),DPR*(H/2-csy*zt));ctx.lineJoin='round';ctx.lineCap='round';
  drawGround(t,T);
  const list=[];
  for(const d of STATIC){if(t<d.t0-.1)continue;const b=d.bb;if(b.x1<vx0||b.x0>vx1||b.y1<vy0||b.y0>vy1)continue;list.push(d)}
  for(const d of DYN){if(t<d.t0)continue;d.upd(T);if(d.sx<vx0-60||d.sx>vx1+60||d.sy<vy0-20||d.sy>vy1+80)continue;list.push(d)}
  list.sort((a,b)=>a.k-b.k);
  for(const d of list){JIT=d.dyn?0:1;d.draw(t,T)}
  if(NIGHT){drawGlows();ctx.setTransform(DPR*zt,0,0,DPR*zt,DPR*(W/2-csx*zt),DPR*(H/2-csy*zt))}
  JIT=0;drawSky(t,T,zt);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(NIGHT)drawMoon(T,clamp01((1.55-cam.zoom)/.45));
  const fade=Math.max(modeFade,t<.9?1-t/.9:t>49.1?(t-49.1)/.9:0);if(fade>0){ctx.globalAlpha=smooth(clamp01(fade));ctx.fillStyle=COL.paper;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
  ctx.globalCompositeOperation='multiply';ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(overlay,0,0);ctx.globalCompositeOperation='source-over';
  ctx.setTransform(DPR,0,0,DPR,0,0);compass();
}
function compass(){const x=W-46-(W<560?0:10),y=H-(W<560?120:92);ctx.save();ctx.translate(x,y);ctx.beginPath();ctx.arc(0,0,22,0,TAU);ctx.fillStyle='rgba(251,246,234,.85)';ctx.fill();ctx.strokeStyle=INK2;ctx.lineWidth=1;ctx.stroke();
  const dx=-.894,dy=-.447;ctx.beginPath();ctx.moveTo(dx*15,dy*15);ctx.lineTo(-dy*4,dx*4);ctx.lineTo(-dx*9,-dy*9);ctx.lineTo(dy*4,-dx*4);ctx.closePath();ctx.fillStyle='#e8664d';ctx.fill();ctx.strokeStyle=INK;ctx.stroke();
  ctx.font="700 15px Caveat, cursive";ctx.fillStyle='#5c4842';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('N',dx*22+6,dy*22-3);ctx.restore()}

/* ---------- loop + controls ---------- */
const playBtn=document.getElementById('play'),icon=document.getElementById('icon'),scrub=document.getElementById('scrub'),timeEl=document.getElementById('time'),chapEl=document.getElementById('chapter');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const qT=parseFloat(new URLSearchParams(location.search).get('t'));if(new URLSearchParams(location.search).has('bare'))document.body.classList.add('bare');
let T=isNaN(qT)?(reduce?46:0):qT,paused=reduce||!isNaN(qT),last=performance.now(),dragging=false,lastChap=-1,lastSec=-1,modeFade=0;
const modeBtn=document.getElementById('mode'),modeIcon=document.getElementById('modeIcon');
const MOON_SVG='<path d="M9.6 1.1A6 6 0 1 0 12.9 9.2 4.8 4.8 0 0 1 9.6 1.1z"/>',SUN_SVG='<circle cx="7" cy="7" r="2.8"/><path d="M7 .6v1.8M7 11.6v1.8M.6 7h1.8M11.6 7h1.8M2.5 2.5l1.3 1.3M10.2 10.2l1.3 1.3M2.5 11.5l1.3-1.3M10.2 3.8l1.3-1.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/>';
const qN=new URLSearchParams(location.search).get('night');let savedMode=null;try{savedMode=localStorage.getItem('bj-night')}catch(e){}
NIGHT=qN!==null?qN!=='0':savedMode==='1';
function applyMode(){document.body.classList.toggle('night',NIGHT);modeIcon.innerHTML=NIGHT?SUN_SVG:MOON_SVG;modeBtn.setAttribute('aria-label',NIGHT?'Switch to day':'Switch to night');modeBtn.title=NIGHT?'Day (N)':'Night (N)';lastChap=-1}
function toggleMode(){NIGHT=!NIGHT;try{localStorage.setItem('bj-night',NIGHT?'1':'0')}catch(e){}modeFade=1;applyMode()}
modeBtn.onclick=toggleMode;applyMode();
function setIcon(){icon.innerHTML=paused?'<path d="M3 1.5v11l9.5-5.5z"/>':'<rect x="2" y="1" width="3.5" height="12" rx="1"/><rect x="8.5" y="1" width="3.5" height="12" rx="1"/>';playBtn.setAttribute('aria-label',paused?'Play':'Pause')}
playBtn.onclick=()=>{paused=!paused;setIcon()};setIcon();
addEventListener('keydown',e=>{if(e.code==='KeyN'&&!e.metaKey&&!e.ctrlKey){toggleMode();return}if(e.code==='Space'&&e.target.tagName!=='INPUT'&&e.target.tagName!=='BUTTON'){e.preventDefault();paused=!paused;setIcon()}});
scrub.addEventListener('input',()=>{dragging=true;T=Math.floor(T/LOOP)*LOOP+parseFloat(scrub.value)});scrub.addEventListener('change',()=>dragging=false);
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;modeFade=Math.max(0,modeFade-dt*2.2);if(!paused&&!dragging)T+=dt;const t=((T%LOOP)+LOOP)%LOOP;
  render(t,T);
  if(!dragging)scrub.value=t.toFixed(2);const sec=Math.floor(t);if(sec!==lastSec){lastSec=sec;timeEl.textContent=`${fmt(t)} / ${fmt(LOOP)}`}
  let ci=0;for(let i=0;i<CHAPTERS.length;i++)if(t>=CHAPTERS[i][0])ci=i;if(ci!==lastChap){lastChap=ci;chapEl.style.opacity=0;setTimeout(()=>{chapEl.textContent=NIGHT?CHAPTERS_NIGHT[ci]:CHAPTERS[ci][1];chapEl.style.opacity=1},250)}
  requestAnimationFrame(frame)}
if(!ctx.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h){this.rect(x,y,w,h)};
window.__sf={render:(t)=>render(t,t),set:(t)=>{T=t;paused=true;setIcon()}};
requestAnimationFrame(frame);
})();
</script>
